name: quality
# workflow_call: deploy-pages la reutiliza para publicar solo si las pruebas del MISMO commit pasan.
on: [push, pull_request, workflow_call]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env: {TEST_MONGO_URI: "mongodb://127.0.0.1:27017"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest --cov=app
      - run: python scripts/harness.py validate
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci && npm test && npm run build
