name: maintenance
# Mantenimiento programado de la API desplegada (Render free no incluye cron gratuito):
# cargas interrumpidas, borrados pendientes, retención, conciliación de Silver y reconstrucción de Gold.
# Requiere: variable de repositorio API_URL y secreto ADMIN_TOKEN (el mismo valor configurado en Render).
on:
  schedule:
    - cron: "17 8 * * *"      # diario, 03:17 en Bogotá (UTC-5)
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: maintenance, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ejecutar mantenimiento
        env:
          API_URL: ${{ vars.API_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo "::warning::API_URL o ADMIN_TOKEN sin configurar; no se ejecuta el mantenimiento."
            exit 0
          fi
          # Render free se duerme: el primer intento puede tardar ~1 min en despertar el servicio.
          curl --fail-with-body --silent --show-error --retry 4 --retry-delay 20 --retry-all-errors --max-time 120 \
               -X POST "${API_URL%/}/api/admin/maintenance?trigger=schedule" \
               -H "X-Admin-Token: ${ADMIN_TOKEN}" | tee result.json
