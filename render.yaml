services:
  - type: web
    name: hoja-de-vida-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: virginia                 # misma zona que Atlas (AWS us-east-1); cámbiela si su clúster está en otra región
    healthCheckPath: /api/health
    envVars:
      - {key: MONGO_URI, sync: false}
      - {key: MONGO_DB, value: hoja_de_vida}
      - {key: CORS_ORIGINS, sync: false}
      - {key: STORAGE_BACKEND, value: supabase}
      - {key: SUPABASE_URL, sync: false}
      - {key: SUPABASE_SERVICE_KEY, sync: false}
      - {key: SUPABASE_BUCKET, value: certificados}
      - {key: TRUST_PROXY, value: "true"}        # IP real del cliente desde X-Forwarded-For (límites de uso)
      - {key: USER_STORAGE_QUOTA_MB, value: "25"}
      - {key: ADMIN_TOKEN, generateValue: true}   # build-gold y /api/admin/maintenance (vacío = desactivado)
